# Configuration de la recherche (Pointant vers le conteneur OpenSearch)
search {
  provider = "elasticsearch"
  uri = "http://opensearch:9200"
  # Spécifier le nom explicite de l'index utilisé par Cortex
  index = "cortex"
  
  # Activer la création automatique de l'index si absent
  autoCreateIndex = true
}

# Désactivation du téléchargement automatique des analyseurs/répondeurs distants
analyzer.urls = []
responder.urls = []

# (Optionnel) Si OpenSearch requiert une authentification basique
# search.basicAuth.username = "admin"
# search.basicAuth.password = "admin"