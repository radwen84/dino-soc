# Mini-SOC Falco Configuration

json_output: true
json_include_output_property: true
json_include_tags_property: true

log_stderr: true
log_syslog: true
log_level: info

priority: notice

# Utilisation de la clé plurielle pour éviter le warning de déprécation
rules_files:
  - /etc/falco/falco_rules.yaml
  - /etc/falco/falco_rules.local.yaml
  - /etc/falco/rules.d

stdout_output:
  enabled: true

file_output:
  enabled: true
  keep_alive: false
  filename: /var/log/falco/events.json

http_output:
  enabled: false

program_output:
  enabled: false

# Désactivé pour éviter les erreurs SSL/TLS au démarrage
grpc:
  enabled: false
  bind_address: "0.0.0.0:5060"
  threadiness: 4

grpc_output:
  enabled: false

webserver:
  enabled: true
  listen_port: 8765
  k8s_healthz_endpoint: /healthz

metrics:
  enabled: true
  interval: 30s
  output_rule: true