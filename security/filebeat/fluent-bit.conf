[SERVICE]
    Flush                     1
    Grace                     5
    Log_Level                 info
    Parsers_File              /fluent-bit/etc/parsers.conf
    storage.path              /tmp/fluent-bit-storage
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 10M

[INPUT]
    Name              tail
    Path              /var/ossec/logs/alerts/alerts.json
    Tag               wazuh.alerts
    Parser            json
    DB                /tmp/fluent-bit-storage/wazuh-alerts.db
    Read_from_Head    True
    Refresh_Interval  2
    Skip_Long_Lines   On
    Mem_Buf_Limit     20M

[FILTER]
    Name          modify
    Match         wazuh.alerts
    Add           service.name wazuh

[OUTPUT]
    Name                  opensearch
    Match                 wazuh.alerts
    Host                  opensearch
    Port                  9200
    Index                 wazuh-alerts
    Logstash_Format       On
    Logstash_Prefix       wazuh-alerts
    Suppress_Type_Name    On
    Replace_Dots          On
    Generate_ID           On
    Retry_Limit           False