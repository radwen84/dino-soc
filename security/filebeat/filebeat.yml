# ============================================================
# Mini-SOC Platform - Filebeat Configuration (Filestream)
# ============================================================

filebeat.inputs:
  - type: filestream
    id: wazuh-alerts
    enabled: true
    paths:
      - /var/ossec/logs/alerts/alerts.json
    parsers:
      - ndjson:
          target: ""
          add_error_key: true
    # Permet de lire depuis le début si le fichier est nouveau
    prospector.scanner.check_interval: 10s

processors:
  - add_host_metadata: ~

# ============================================================
# INDEX TEMPLATES & ILM (Désactivés pour OpenSearch)
# ============================================================
setup.template.enabled: false
setup.ilm.enabled: false
setup.template.name: "wazuh-alerts"
setup.template.pattern: "wazuh-alerts-*"

# ============================================================
# OUTPUT - OpenSearch
# ============================================================
output.elasticsearch:
  hosts: ["http://opensearch:9200"]
  index: "wazuh-alerts-%{+YYYY.MM.dd}"
  allow_older_versions: true

# ============================================================
# LOGGING
# ============================================================
logging.level: info
logging.to_files: false