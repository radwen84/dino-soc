title: SSH Brute Force Attack
id: 5e914ab6-6582-4ce8-9f86-a9ab9e38a64b
status: stable
description: Detects six or more failed SSH authentication attempts from the same source IP within five minutes.
author: Azmi SOMAI - MiniSOC
date: 2026/07/17
tags:
  - attack.credential_access
  - attack.t1110.001
  - attack.t1110
correlation:
  type: event_count
  rules:
    - ssh_failed_auth
  group-by:
    - source_ip
  timespan: 5m
  condition:
    gte: 6
falsepositives:
  - Automated scripts with wrong credentials
  - Misconfigured monitoring agents
level: high
