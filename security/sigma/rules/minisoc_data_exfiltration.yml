title: Potential Data Exfiltration via DNS
id: d4e9a1b3-5c6f-6a0d-1e3f-7f8c9d0e2a3b
status: experimental
description: Detects unusually long DNS queries that may indicate DNS tunneling
author: Azmi SOMAI - MiniSOC
date: 2026/07/17
tags:
  - attack.exfiltration
  - attack.t1048
  - attack.command_and_control
  - attack.t1071.004
logsource:
  category: dns
  product: zeek
detection:
  selection:
    query_length|gt: 50
  condition: selection | count() by src_ip > 100
  timeframe: 10m
falsepositives:
  - DKIM/SPF records
  - CDN DNS queries
level: medium

