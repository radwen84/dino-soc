title: Potential Data Exfiltration via DNS
id: 9bbd9a82-8ed2-45c4-ac6e-b99d4c384172
status: experimental
description: Detects more than 100 unusually long DNS queries from the same source IP within ten minutes.
author: Azmi SOMAI - MiniSOC
date: 2026/07/17
tags:
  - attack.exfiltration
  - attack.t1048
  - attack.command_and_control
  - attack.t1071.004
correlation:
  type: event_count
  rules:
    - long_dns_query
  group-by:
    - src_ip
  timespan: 10m
  condition:
    gt: 100
falsepositives:
  - DKIM/SPF records
  - CDN DNS queries
level: medium

