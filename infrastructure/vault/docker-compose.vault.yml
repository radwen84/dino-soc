version: '3.9'

services:
  vault:
    image: hashicorp/vault:1.17
    container_name: minisoc-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_API_ADDR: http://vault:8200
    volumes:
      - ./config:/vault/config
      - ./policies:/vault/policies
      - vault-data:/vault/file
    command: vault server -config=/vault/config/vault.hcl
    ports:
      - "8200:8200"
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  vault-data:

networks:
  backend-net:
    external: true
