---
# Mini-SOC Deployment Variables

project_name: minisoc
deploy_user: deploy
app_version: "1.0.0"

# Docker
docker_compose_version: "2.27.1"
registry_url: "registry.minisoc.local"

# Application
backend_port: 4000
frontend_port: 80
api_domain: "soc.minisoc.local"

# Database
postgres_version: "16"
postgres_port: 5432
postgres_db: "minisoc"
postgres_max_connections: 200

# Redis
redis_version: "7"
redis_port: 6379
redis_maxmemory: "256mb"

# Wazuh
wazuh_version: "4.8.0"
wazuh_api_port: 55000

# Monitoring
prometheus_retention: "30d"
grafana_port: 3001
