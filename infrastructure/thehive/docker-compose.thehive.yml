version: '3.9'

services:
  thehive:
    image: strangebee/thehive:5.3
    container_name: minisoc-thehive
    restart: unless-stopped
    environment:
      - JVM_OPTS=-Xms512m -Xmx1024m
    volumes:
      - thehive-data:/opt/thp/thehive/data
      - ./thehive/application.conf:/etc/thehive/application.conf:ro
    networks:
      - backend
      - siem
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  cortex:
    image: thehiveproject/cortex:3.1.8
    container_name: minisoc-cortex
    restart: unless-stopped
    privileged: true
    environment:
      - JVM_OPTS=-Xms256m -Xmx512m
    volumes:
      - cortex-data:/opt/cortex/data
      - ./security/cortex/application.conf:/etc/cortex/application.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    networks:
      - backend
      - siem
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  thehive-data:
  cortex-data:

networks:
  backend:
    external: true
  siem:
    external: true