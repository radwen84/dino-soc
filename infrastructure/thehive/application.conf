# TheHive 5 Configuration - Mini-SOC

# Database
db.janusgraph {
  storage {
    backend = cql
    hostname = ["cassandra"]
    cql {
      cluster-name = minisoc
      keyspace = thehive
    }
  }
  index.search {
    backend = elasticsearch
    hostname = ["elasticsearch-thehive"]
    index-name = thehive
  }
}

storage {
  provider = localfs
  localfs.location = /opt/thp/thehive/data
}

# Cortex integration
play.modules.enabled += org.thp.thehive.connector.cortex.CortexModule
cortex {
  servers = [
    {
      name = "MiniSOC-Cortex"
      url = "http://cortex:9001"
      auth {
        type = "bearer"
        key = "CHANGEME_CORTEX_API_KEY"
      }
    }
  ]
  refreshDelay = 1m
  maxRetryOnError = 3
}

# MISP integration
play.modules.enabled += org.thp.thehive.connector.misp.MispModule
misp {
  servers = [
    {
      name = "MiniSOC-MISP"
      url = "https://misp.local"
      auth {
        type = "key"
        key = "CHANGEME_MISP_API_KEY"
      }
      wsConfig {
        ssl.loose.acceptAnyCertificate = true
      }
    }
  ]
}

# Authentication
auth {
  providers = [
    {name = local}
  ]
}
