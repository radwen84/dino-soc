server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/**/*.log
    pipeline_stages:
      - docker: {}
      - match:
          selector: '{job="docker"}'
          stages:
            - json:
                expressions:
                  level: level
                  msg: msg
            - labels:
                level:
            - timestamp:
                source: time
                format: RFC3339Nano

  - job_name: minisoc-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: minisoc-backend
          __path__: /var/log/minisoc/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            context: context
            message: message
      - labels:
          level:
          context:
