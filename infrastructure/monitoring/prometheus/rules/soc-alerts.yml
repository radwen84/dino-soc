groups:
  - name: minisoc-availability
    rules:
      - alert: BackendDown
        expr: up{job="minisoc-backend"} == 0
        for: 1m
        labels:
          severity: critical
          team: soc
        annotations:
          summary: "Backend API is down"
          description: "MiniSOC backend has been unreachable for more than 1 minute."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: high
          team: soc
        annotations:
          summary: "High error rate detected (>5%)"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          team: soc
        annotations:
          summary: "P95 response time > 2s"

  - name: minisoc-security
    rules:
      - alert: HighFailedLogins
        expr: rate(auth_login_failures_total[5m]) > 10
        for: 2m
        labels:
          severity: high
          team: soc
        annotations:
          summary: "High rate of failed login attempts"
          description: "More than 10 failed logins/min - possible brute force attack."

      - alert: CriticalIncidentCreated
        expr: increase(incidents_created_total{severity="critical"}[5m]) > 0
        labels:
          severity: critical
          team: soc
        annotations:
          summary: "New critical incident detected"

      - alert: IOCMatchDetected
        expr: increase(ioc_matches_total[5m]) > 0
        labels:
          severity: high
          team: soc
        annotations:
          summary: "IOC match detected in traffic"

  - name: minisoc-resources
    rules:
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job="minisoc-backend"} > 450 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backend memory usage > 450MB"

      - alert: DatabaseConnectionPoolExhausted
        expr: prisma_pool_active_connections / prisma_pool_max_connections > 0.9
        for: 2m
        labels:
          severity: high
        annotations:
          summary: "Database connection pool nearly exhausted (>90%)"

      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space < 10%"