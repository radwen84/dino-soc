apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: minisoc
  labels:
    app: backend
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
        component: api
    spec:
      serviceAccountName: minisoc-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: backend
          image: registry.minisoc.local/minisoc-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: minisoc-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: minisoc-secrets
                  key: jwt-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: minisoc-secrets
                  key: jwt-refresh-secret
            - name: REDIS_HOST
              value: "redis.minisoc.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minisoc-secrets
                  key: redis-password
            - name: OPENSEARCH_URL
              value: "http://opensearch.minisoc.svc.cluster.local:9200"
            - name: WAZUH_HOST
              value: "wazuh-manager.minisoc.svc.cluster.local"
            - name: WAZUH_API_PORT
              value: "55000"
            - name: WAZUH_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minisoc-secrets
                  key: wazuh-api-password
            # Threat Intelligence
            - name: MISP_URL
              value: "http://misp.minisoc.svc.cluster.local:80"
            - name: MISP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: minisoc-secrets
                  key: misp-api-key
            - name: ABUSEIPDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: minisoc-secrets
                  key: abuseipdb-api-key
            - name: OTX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: minisoc-secrets
                  key: otx-api-key
            # ML Engine
            - name: ML_ENGINE_URL
              value: "http://ml-engine.minisoc.svc.cluster.local:8000"
            # TheHive & Cortex
            - name: THEHIVE_URL
              value: "http://thehive.minisoc.svc.cluster.local:9000"
            - name: THEHIVE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: minisoc-secrets
                  key: thehive-api-key
            - name: THEHIVE_ORGANIZATION
              value: "Mini-SOC"
            - name: CORTEX_URL
              value: "http://cortex.minisoc.svc.cluster.local:9001"
            - name: CORTEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: minisoc-secrets
                  key: cortex-api-key
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: minisoc
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: minisoc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

