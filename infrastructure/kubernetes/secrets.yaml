apiVersion: v1
kind: Secret
metadata:
  name: minisoc-secrets
  namespace: minisoc
type: Opaque
data:
  # ⚠️ All values below are Base64-encoded placeholders — REPLACE before deploying
  # Generate with: echo -n 'YOUR_VALUE' | base64
  database-url: REPLACE_WITH_BASE64_DATABASE_URL
  jwt-secret: REPLACE_WITH_BASE64_JWT_SECRET
  jwt-refresh-secret: REPLACE_WITH_BASE64_JWT_REFRESH_SECRET
  redis-password: REPLACE_WITH_BASE64_REDIS_PASSWORD
  wazuh-api-password: REPLACE_WITH_BASE64_WAZUH_API_PASSWORD
  # Threat Intelligence
  misp-api-key: REPLACE_WITH_BASE64_MISP_API_KEY
  abuseipdb-api-key: REPLACE_WITH_BASE64_ABUSEIPDB_API_KEY
  otx-api-key: REPLACE_WITH_BASE64_OTX_API_KEY
  # TheHive & Cortex
  thehive-api-key: REPLACE_WITH_BASE64_THEHIVE_API_KEY
  cortex-api-key: REPLACE_WITH_BASE64_CORTEX_API_KEY
  # MISP Database
  misp-db-password: REPLACE_WITH_BASE64_MISP_DB_PASSWORD
  misp-db-root-password: REPLACE_WITH_BASE64_MISP_DB_ROOT_PASSWORD
  # TAXII (optional)
  taxii-username: ""
  taxii-password: ""
