# Optimizing connection settings
max_connections = 100
superuser_reserved_connections = 3

# Allocating memory limits
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 64MB
effective_cache_size = 768MB

# Configuring write-ahead logs (WAL)
wal_buffers = 16MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
min_wal_size = 512MB
max_wal_size = 2GB

# Configuring background writer
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

# Tuning storage performance metrics
random_page_cost = 1.1
effective_io_concurrency = 200

# Enabling detailed system logging
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250

# Enabling audit and query parameters
log_connections = on
log_disconnections = on
log_duration = off
log_line_prefix = '%m [%p] %q%u@%d '
log_statement = 'ddl'
log_timezone = 'UTC'

# Enabling auto-vacuum daemon for indices maintenance
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50