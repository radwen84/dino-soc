# ============================================================
# Mini-SOC Platform - Docker Compose 
# ============================================================

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: false
  monitoring:
    driver: bridge
    internal: false
  siem:
    driver: bridge
    internal: false

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  jwt_refresh_secret:
    file: ./secrets/jwt_refresh_secret.txt
  wazuh_api_password:
    file: ./secrets/wazuh_api_password.txt
  redis_password:
    file: ./secrets/redis_password.txt

services:
  # ============================================
  # REVERSE PROXY - Nginx
  # ============================================
  nginx:
    build:
      context: .
      dockerfile: infrastructure/nginx/Dockerfile
    container_name: minisoc-nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      nestjs-api:
        condition: service_healthy

  # ============================================
  # BACKEND - NestJS API
  # ============================================
  nestjs-api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: production
    container_name: minisoc-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - backend
    secrets:
      - source: db_password
        mode: 0444
      - source: jwt_secret
        mode: 0444
      - source: jwt_refresh_secret
        mode: 0444
      - source: wazuh_api_password
        mode: 0444
      - source: redis_password
        mode: 0444
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=minisoc
      - DB_USER=minisoc_app
      - DATABASE_URL=${DATABASE_URL:-postgresql://minisoc_app:ci-test-db-password-123@postgres:5432/minisoc?schema=public}
      - JWT_SECRET=${JWT_SECRET:-ci-super-secret-jwt-key-minimum-32-chars}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-ci-super-secret-refresh-key-minimum-32-chars}
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_PROTOCOL=http
      - OPENSEARCH_URL=http://opensearch:9200
      - API_CORS_ORIGINS=${API_CORS_ORIGINS:-*}
      - WAZUH_HOST=${WAZUH_HOST:-minisoc-wazuh}
      - WAZUH_API_PORT=${WAZUH_API_PORT:-55000}
      - WAZUH_API_USER=${WAZUH_API_USER:-wazuh-wui}
      - WAZUH_API_PASSWORD=Wazuh-WUI-Pass2026!
      - WAZUH_API_PASSWORD_FILE=/run/secrets/wazuh_api_password
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=6379
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - JWT_REFRESH_SECRET_FILE=/run/secrets/jwt_refresh_secret
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - MISP_URL=http://misp:80
      - MISP_API_KEY=${MISP_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - OTX_API_KEY=${OTX_API_KEY:-}
      - TAXII_URL=${TAXII_URL:-}
      - TAXII_API_ROOT=${TAXII_API_ROOT:-}
      - TAXII_COLLECTION_ID=${TAXII_COLLECTION_ID:-}
      - TAXII_USERNAME=${TAXII_USERNAME:-}
      - TAXII_PASSWORD=${TAXII_PASSWORD:-}
      - ML_ENGINE_URL=http://ml-engine:8000
      - PLUGIN_ENGINE_URL=http://plugin-engine:8001
      - PLUGIN_ENGINE_TIMEOUT_MS=${PLUGIN_ENGINE_TIMEOUT_MS:-8000}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - THEHIVE_URL=http://thehive:9000
      - THEHIVE_API_KEY=rbcXFKtoPHiJJAASOeEneevXlCzG/APo
      - THEHIVE_ORGANIZATION=${THEHIVE_ORGANIZATION:-Mini-SOC}
      - CORTEX_URL=http://cortex:9001
      - CORTEX_API_KEY=${CORTEX_API_KEY:-}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - N8N_SOAR_WEBHOOK_URL=http://minisoc-n8n:5678/webhook/incident-response
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    user: "1001:1001"
    read_only: false
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-engine:
        condition: service_healthy
      plugin-engine:
        condition: service_healthy

  # ============================================
  # DATABASE - PostgreSQL
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: minisoc-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    networks:
      - backend
    secrets:
      - db_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: minisoc
      POSTGRES_USER: minisoc_app
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infrastructure/docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infrastructure/docker/postgres/init/init-n8n-db.sql:/docker-entrypoint-initdb.d/init-n8n-db.sql:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minisoc_app -d minisoc"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # CACHE - Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: minisoc-redis
    restart: unless-stopped
    networks:
      - backend
    secrets:
      - redis_password
    command: >
      sh -c 'redis-server
      --requirepass "$$(cat /run/secrets/redis_password)"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes'
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============================================
  # WAZUH MANAGER - SIEM/HIDS
  # ============================================
  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.0
    container_name: minisoc-wazuh
    restart: unless-stopped
    secrets:
      - wazuh_api_password
    networks:
      - siem
      - backend
    ports:
      - "1514:1514/tcp"
      - "1515:1515/tcp"
      - "55000:55000/tcp"
    volumes:
      - wazuh_data:/var/ossec/data
      - wazuh_logs:/var/ossec/logs
      - wazuh_api_config:/var/ossec/api/configuration
      - ./security/wazuh/ossec.conf:/var/ossec/etc/ossec.conf:ro
      - ./security/wazuh/rules:/var/ossec/etc/rules:ro
      - ./security/wazuh/decoders:/var/ossec/etc/decoders:ro
      - ./security/wazuh/shared/ar.conf:/var/ossec/etc/shared/ar.conf
      - ./security/wazuh/sync-api-password.sh:/docker-entrypoint-init.d/sync-api-password.sh:ro
      - suricata_logs:/var/log/suricata:ro
      - zeek_logs:/var/log/zeek:ro
      - falco_logs:/var/log/falco:ro
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "pgrep wazuh-analysisd || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ============================================
  # OPENSEARCH - SIEM Data Lake
  # ============================================
  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: minisoc-opensearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      siem:
        aliases:
          - wazuh.indexer
      backend:
    environment:
      cluster.name: minisoc-cluster
      node.name: opensearch-node1
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      bootstrap.memory_lock: "true"
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${OPENSEARCH_ADMIN_PASSWORD:-SecUr3!MiniSOC#2026}"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================
  # FLUENT BIT - Wazuh Log Shipper
  # ============================================
  filebeat:
    image: fluent/fluent-bit:3.2.10
    container_name: minisoc-filebeat
    restart: unless-stopped
    user: root
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]
    networks:
      - siem
      - backend
    volumes:
      - wazuh_logs:/var/ossec/logs:ro
      - ./security/filebeat/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    depends_on:
      opensearch:
        condition: service_healthy

  # ============================================
  # SURICATA - Network IDS/IPS
  # ============================================
  suricata:
    build:
      context: ./security/suricata
      dockerfile: Dockerfile
    container_name: minisoc-suricata
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    command: -i ${SURICATA_INTERFACE:-enp0s3} -c /etc/suricata/suricata.yaml
    volumes:
      - suricata_logs:/var/log/suricata
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  # ============================================
  # ZEEK - Network Security Monitoring
  # ============================================
  zeek:
    build:
      context: ./security/zeek
      dockerfile: Dockerfile
    container_name: minisoc-zeek
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    entrypoint: ["/usr/local/zeek/bin/zeek"]
    command: ["-i", "enp0s3", "local"]
    volumes:
      - zeek_logs:/var/log/zeek

  # ============================================
  # FALCO - Runtime Security
  # ============================================
  falco:
    build:
      context: ./security/falco
      dockerfile: Dockerfile
    container_name: minisoc-falco
    restart: unless-stopped
    privileged: true
    pid: host
    network_mode: host
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
      - BPF
      - PERFMON
    entrypoint: ["/usr/bin/falco", "-o", "engine.kind=modern_ebpf", "-c", "/etc/falco/falco.yaml"]
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
      - /dev:/dev
      - /proc:/proc:ro
      - /boot:/boot:ro
      - /sys/kernel/debug:/sys/kernel/debug:rw
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - /sys/fs/bpf:/sys/fs/bpf:rw
      - /etc:/host/etc:ro
      - falco_logs:/var/log/falco

  # ============================================
  # ML ENGINE - Anomaly Detection
  # ============================================
  ml-engine:
    build:
      context: ./services/ml-engine
      dockerfile: Dockerfile
    container_name: minisoc-ml-engine
    restart: unless-stopped
    ports:                 
      - "8000:8000"
      - "8888:8888"
    networks:
      - backend
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-admin}
      - MODEL_PATH=./models
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      opensearch:
        condition: service_healthy

  # ============================================
  # PLUGIN ENGINE - Extensible integrations (Express)
  # ============================================
  plugin-engine:
    build:
      context: .
      dockerfile: services/plugin-engine/Dockerfile
    container_name: minisoc-plugin-engine
    restart: unless-stopped
    networks:
      - backend
    ports:                 
      - "8001:8001"  
    environment:
      - NODE_ENV=production
      - PORT=8001
      - LOG_LEVEL=${PLUGIN_ENGINE_LOG_LEVEL:-info}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================
  # MISP LOCAL - Threat Intelligence Platform
  # ============================================
  misp:
    image: ghcr.io/misp/misp-docker/misp-core:latest
    container_name: minisoc-misp
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    networks:
      - backend
    environment:
      - MISP_BASEURL=http://localhost:8080
      - MISP_ADMIN_EMAIL=admin@minisoc.local
      - MISP_ADMIN_PASSPHRASE=${MISP_ADMIN_PASSPHRASE:-ChangeMe2026!}
      - MYSQL_HOST=misp-db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=misp
      - MYSQL_USER=${MISP_DB_USER:-misp}
      - MYSQL_PASSWORD=${MISP_DB_PASSWORD:-MispDbPassword2026}
      - REDIS_HOST=misp-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${MISP_REDIS_PASSWORD:-MispRedisPassword2026}
      - MISP_WORKERS=1
      - MISP_RUN_WORKERS=true
    volumes:
      - misp_data:/var/www/MISP/app/files
      - misp_config:/var/www/MISP/app/Config
      - misp_tmp_data:/var/www/MISP/app/tmp
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"
    healthcheck:
      test: ["CMD-SHELL", "pgrep php-fpm || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s
    depends_on:
      misp-db:
        condition: service_healthy
      misp-redis:
        condition: service_healthy

  misp-db:
    image: mariadb:10.11
    container_name: minisoc-misp-db
    restart: unless-stopped
    networks:
      - backend
    environment:
      - MYSQL_DATABASE=misp
      - MYSQL_USER=${MISP_DB_USER:-misp}
      - MYSQL_PASSWORD=${MISP_DB_PASSWORD:-MispDbPassword2026}
      - MYSQL_ROOT_PASSWORD=${MISP_DB_ROOT_PASSWORD:-MispRootPassword2026}
    volumes:
      - misp_db_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  misp-redis:
    image: redis:7.2-alpine
    container_name: minisoc-misp-redis
    restart: unless-stopped
    networks:
      - backend
    command: redis-server --requirepass "${MISP_REDIS_PASSWORD:-MispRedisPassword2026}" --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - misp_redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # THEHIVE 5 - Incident Response Platform
  # ============================================
  thehive:
    image: strangebee/thehive:5.3
    container_name: minisoc-thehive
    restart: unless-stopped
    networks:
      - backend
    environment:
      - JVM_OPTS=-Xms512m -Xmx1024m
    volumes:
      - thehive_data:/opt/thp/thehive/data
      - thehive_index:/opt/thp/thehive/index
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/index.html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      opensearch:
        condition: service_healthy

  # ============================================
  # CORTEX - Observable Analysis & Response
  # ============================================
  cortex:
    image: thehiveproject/cortex:latest
    container_name: minisoc-cortex
    restart: unless-stopped
    privileged: true
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "raw.githubusercontent.com:185.199.108.133" 
    networks:
      - backend
    environment:
      - JVM_OPTS=-Xms256m -Xmx512m -Dsearch.host.0=opensearch:9200 -Danalyzer.urls=["/tmp/analyzers.json"]
      - job_directory=/opt/cortex/jobs
      - "JAVA_OPTS=-Dcortex.analyzer.urls=[\"/tmp/analyzers.json\"]"
    volumes:
      - ./analyzers.json:/tmp/analyzers.json:ro
      - cortex_data:/opt/cortex/data
      - ./security/cortex/application.conf:/etc/cortex/application.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /tmp/cortex-jobs:/tmp/cortex-jobs
      - ./local-analyzers/analyzers:/opt/cortex/analyzers:ro
    ports:
      - "9001:9001"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9001/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      opensearch:
        condition: service_healthy

  # ============================================
  # VAULT - Secrets Management
  # ============================================
  vault:
    image: hashicorp/vault:1.17
    container_name: minisoc-vault
    restart: unless-stopped
    networks:
      - backend
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_ADDR=https://127.0.0.1:8200
      - VAULT_SKIP_VERIFY=true
    ports:
      - "127.0.0.1:8200:8200"
      - "127.0.0.1:8201:8201"
    volumes:
      - vault_data:/vault/data
      - ./infrastructure/vault/config/vault.hcl:/vault/config/vault.hcl:ro
      - ./infrastructure/vault/tls:/vault/tls:ro
      - ./infrastructure/vault/policies:/vault/policies:ro
    entrypoint: ["vault", "server", "-config=/vault/config/vault.hcl"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "vault", "status", "-tls-skip-verify"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # n8n - SOAR (Workflow Automation)
  # ============================================
  n8n:
    image: n8nio/n8n:1.48.0
    container_name: minisoc-n8n
    restart: unless-stopped
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-changeme}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - WEBHOOK_URL=http://minisoc-n8n:5678/
      - N8N_ENDPOINT_WEBHOOK=webhook
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-changeme}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=minisoc_app
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./infrastructure/n8n/workflows:/home/node/workflows:ro
    ports:
      - "5678:5678"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5678/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================
  # PROMETHEUS - Metrics
  # ============================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: minisoc-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - monitoring
      - backend
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================
  # GRAFANA - Visualization
  # ============================================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: minisoc-grafana
    restart: unless-stopped
    ports: 
      - "127.0.0.1:3000:3000"
    networks:
      - monitoring
      - frontend
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_SERVER_ROOT_URL=https://soc.local/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # ALERTMANAGER
  # ============================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: minisoc-alertmanager
    restart: unless-stopped
    networks:
      - monitoring
      - backend
    volumes:
      - ./infrastructure/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # ============================================
  # LOKI - Log Aggregation
  # ============================================
  loki:
    image: grafana/loki:2.9.8
    container_name: minisoc-loki
    restart: unless-stopped
    networks:
      - monitoring
    volumes:
      - ./infrastructure/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  wazuh_data:
    driver: local
  wazuh_logs:
    driver: local
  zeek_logs:
    driver: local
  falco_logs:
    driver: local
  opensearch_data:
    driver: local
  suricata_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  vault_data:
    driver: local
  n8n_data:
    driver: local
  loki_data:
    driver: local
  wazuh_etc_shared:
    driver: local
  misp_data:
    driver: local
  misp_config:
    driver: local
  misp_db_data:
    driver: local
  misp_redis_data:
    driver: local
  thehive_data:
    driver: local
  thehive_index:
    driver: local
  cortex_data:
    driver: local
  wazuh_etc:
    driver: local
  wazuh_api_config:
    driver: local
  misp_tmp_data:
    driver: local
