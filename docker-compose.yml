# ============================================================
# Mini-SOC Platform - Docker Compose (CI/CD & Prod Ready)
# ============================================================

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  monitoring:
    driver: bridge
  siem:
    driver: bridge

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  jwt_refresh_secret:
    file: ./secrets/jwt_refresh_secret.txt
  wazuh_api_password:
    file: ./secrets/wazuh_api_password.txt
  redis_password:
    file: ./secrets/redis_password.txt

services:
  # ============================================
  # REVERSE PROXY - Nginx
  # ============================================
  nginx:
    build:
      context: .
      dockerfile: infrastructure/nginx/Dockerfile
    container_name: minisoc-nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend
      - backend
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # BACKEND - NestJS API
  # ============================================
  nestjs-api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: production
    container_name: minisoc-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - backend
      - frontend
    secrets:
      - db_password
      - jwt_secret
      - wazuh_api_password
      - jwt_refresh_secret
      - redis_password
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://minisoc_app:minisoc_db_password_2026@postgres:5432/minisoc?schema=public}
      - JWT_SECRET=${JWT_SECRET:-minisoc_jwt_secret_key_2026_super_secret_32chars}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-minisoc_jwt_refresh_secret_key_2026_super_secret_32chars}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=minisoc
      - DB_USER=minisoc_app
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_PROTOCOL=http
      - OPENSEARCH_URL=http://opensearch:9200
      - API_CORS_ORIGINS=${API_CORS_ORIGINS:-*}
      - WAZUH_HOST=${WAZUH_HOST:-wazuh-manager}
      - WAZUH_API_PORT=${WAZUH_API_PORT:-55000}
      - WAZUH_API_USER=${WAZUH_API_USER:-wazuh-wui}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ML_ENGINE_URL=http://ml-engine:8000
      - THEHIVE_URL=http://thehive:9000
      - CORTEX_URL=http://cortex:9001
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================
  # DATABASE - PostgreSQL
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: minisoc-postgres
    restart: unless-stopped
    ports: 
      - "5432:5432"
    networks:
      - backend
    secrets:
      - db_password
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minisoc}
      POSTGRES_USER: ${POSTGRES_USER:-minisoc_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minisoc_db_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minisoc_app} -d ${POSTGRES_DB:-minisoc}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # CACHE - Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: minisoc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - backend
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # WAZUH MANAGER - SIEM/HIDS
  # ============================================
  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.0
    container_name: minisoc-wazuh
    restart: unless-stopped
    secrets:
      - wazuh_api_password
    networks:
      - siem
      - backend
    ports:
      - "1514:1514/tcp"
      - "1515:1515/tcp"
      - "55000:55000/tcp"
    volumes:
      - wazuh_data:/var/ossec/data
      - wazuh_logs:/var/ossec/logs
      - suricata_logs:/var/log/suricata:ro
      - zeek_logs:/var/log/zeek:ro
      - falco_logs:/var/log/falco:ro

  # ============================================
  # OPENSEARCH - SIEM Data Lake
  # ============================================
  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: minisoc-opensearch
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - siem
      - backend
    environment:
      - cluster.name=minisoc-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - plugins.security.disabled=true
      - bootstrap.memory_lock=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ============================================
  # SURICATA - Network IDS/IPS
  # ============================================
  suricata:
    build:
      context: ./security/suricata
      dockerfile: Dockerfile
    container_name: minisoc-suricata
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    environment:
      - ORACLE_PORTS=1521
      - HTTP_PORTS=80
    volumes:
      - suricata_logs:/var/log/suricata

  # ============================================
  # ZEEK - Network Security Monitoring
  # ============================================
  zeek:
    build:
      context: ./security/zeek
      dockerfile: Dockerfile
    container_name: minisoc-zeek
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - zeek_logs:/var/log/zeek

  # ============================================
  # FALCO - Cloud-Native Runtime Security
  # ============================================
  falco:
    build:
      context: ./security/falco
      dockerfile: Dockerfile
    container_name: minisoc-falco
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /dev:/host/dev:ro
      - /proc:/host/proc:ro
      - /boot:/host/boot:ro
      - /lib/modules:/host/lib/modules:ro
      - /sys:/host/sys:ro
      - falco_logs:/var/log/falco

  # ============================================
  # ML ANOMALY ENGINE - FastAPI
  # ============================================
  ml-engine:
    build:
      context: ./services/ml-engine
      dockerfile: Dockerfile
    container_name: minisoc-ml-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - backend

  # ============================================
  # THEHIVE 5 - Incident Response Platform
  # ============================================
  thehive:
    image: strangebee/thehive:5.3
    container_name: minisoc-thehive
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "9000:9000"
    volumes:
      - thehive_data:/opt/thp/thehive/data
      - thehive_index:/opt/thp/thehive/index
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/v1/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ============================================
  # CORTEX - Observable Analysis & Response
  # ============================================
  cortex:
    image: thehiveproject/cortex:3.1.8
    container_name: minisoc-cortex
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "9001:9001"
    volumes:
      - cortex_data:/opt/cortex/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9001/api/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ============================================
  # VAULT - Secrets Management
  # ============================================
  vault:
    image: hashicorp/vault:1.17
    container_name: minisoc-vault
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200

  # ============================================
  # n8n - SOAR (Workflow Automation)
  # ============================================
  n8n:
    image: n8nio/n8n:1.48.0
    container_name: minisoc-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    networks:
      - backend
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE:-n8n}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER:-minisoc_app}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD:-minisoc_db_password_2026}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================
  # PROMETHEUS - Metrics
  # ============================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: minisoc-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - monitoring
      - backend
    volumes:
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================
  # GRAFANA - Visualization
  # ============================================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: minisoc-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    networks:
      - monitoring
      - frontend
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres_data:
  redis_data:
  wazuh_data:
  wazuh_logs:
  zeek_logs:
  falco_logs:
  opensearch_data:
  suricata_logs:
  prometheus_data:
  grafana_data:
  vault_data:
  n8n_data:
  thehive_data:
  thehive_index:
  cortex_data: