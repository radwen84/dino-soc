name: Security Pipeline

permissions:
  contents: read
  actions: read
  security-events: write

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  # ==========================================
  # SAST - Static Application Security Testing
  # ==========================================
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/ci \
            --config=p/owasp-top-ten \
            --config=p/typescript \
            --config=p/security-audit \
            --sarif \
            --output=semgrep-results.sarif \
            --metrics=off \
            apps/
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: semgrep-results.sarif

  # ==========================================
  # SCA - Software Composition Analysis
  # ==========================================
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy Backend
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: apps/backend
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          vuln-type: library
      - name: Trivy Frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: apps/frontend
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
      - name: Upload Trivy Backend SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-backend.sarif
      - name: Upload Trivy Frontend SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-frontend.sarif

  # ==========================================
  # SECRET DETECTION
  # ==========================================
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.82.13
        with:
          extra_args: --only-verified --results=verified
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # SBOM
  # ==========================================
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Backend SBOM
        uses: anchore/sbom-action@v0.18.0
        with:
          path: apps/backend
          format: spdx-json
          output-file: sbom-backend.spdx.json
      - name: Generate Frontend SBOM
        uses: anchore/sbom-action@v0.18.0
        with:
          path: apps/frontend
          format: spdx-json
          output-file: sbom-frontend.spdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            sbom-backend.spdx.json
            sbom-frontend.spdx.json

  # ==========================================
  # OWASP Dependency Check
  # ==========================================
  owasp-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (Backend)
        run: npm ci
        working-directory: apps/backend

      - name: Install dependencies (Frontend)
        run: npm ci
        working-directory: apps/frontend

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: MiniSOC
          path: apps/
          format: HTML
          out: reports
          args: --failOnCVSS 8 -- disableNodeJS --disableNodeAudit

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: reports/

  # ==========================================
  # INFRASTRUCTURE SECURITY
  # ==========================================
  infra-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/
          framework: terraform,kubernetes,dockerfile
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true
      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: checkov-results.sarif