name: LOULOU DINO CI Pipeline

on:
  push:
    branches: [main, dino]
  pull_request:
    branches: [main, dino]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: minisoc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.12'
  POSTGRES_TEST_URL: postgresql://test:test@localhost:5432/minisoc_test
  MINISOC_CI_TEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # ============================================================
  # 1. LINT / FORMAT
  # ============================================================
  lint:
    name: Lint / Format (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      - name: Generate Prisma client
        if: matrix.app == 'backend'
        working-directory: apps/backend
        run: npx prisma generate

      - name: Lint
        working-directory: apps/${{ matrix.app }}
        run: npm run lint

      - name: Format check
        working-directory: apps/${{ matrix.app }}
        run: npm run format:check

  # ============================================================
  # 2. BACKEND TESTS
  # ============================================================
  test-backend:
    name: Backend Unit / Integration
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: minisoc_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d minisoc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci --omit=optional

      - name: Generate Prisma client
        working-directory: apps/backend
        run: npx prisma generate

      - name: Prepare test database
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ env.POSTGRES_TEST_URL }}
        run: |
          set -euo pipefail
          npx prisma db push --skip-generate --accept-data-loss
          npx prisma validate

      - name: Seed test database
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ env.POSTGRES_TEST_URL }}
        run: |
          set -euo pipefail
          if npm run | grep -q "db:seed"; then
            npm run db:seed
          else
            npx prisma db seed
          fi

      - name: Run backend tests
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ env.POSTGRES_TEST_URL }}
          JWT_SECRET: super-secure-sonar-test-secret-minimum-32-chars-long
          JWT_REFRESH_SECRET: super-secure-refresh-test-secret-minimum-32-chars
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: npm run test:cov -- --watch=false

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage/
          retention-days: 14
          if-no-files-found: ignore

  # ============================================================
  # 3. FRONTEND TESTS
  # ============================================================
  test-frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Run Vitest
        working-directory: apps/frontend
        env:
          CI: 'true'
        run: npx vitest run

  # ============================================================
  # 4. BUILD
  # ============================================================
  build:
    name: Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      - name: Generate Prisma client
        if: matrix.app == 'backend'
        working-directory: apps/backend
        run: npx prisma generate

      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: npm run build

  # ============================================================
  # 5. SECURITY SCAN
  # ============================================================
  security:
    name: Dependency / Filesystem Security Scan
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Trivy backend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: apps/backend
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: apps/frontend
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: npm audit
        run: |
          set -euo pipefail
          echo "--- Backend audit ---"
          (cd apps/backend && npm ci --ignore-scripts && npm audit --audit-level=critical) || echo "::warning::Backend audit reported vulnerabilities"
          echo "--- Frontend audit ---"
          (cd apps/frontend && npm ci --ignore-scripts && npm audit --audit-level=critical) || echo "::warning::Frontend audit reported vulnerabilities"

  # ============================================================
  # 6. STATIC INFRA / CONFIG VALIDATION
  # ============================================================
  infra-validation:
    name: Infrastructure / Config Validation
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Python validation dependencies
        run: python3 -m pip install pyyaml

      - name: Prepare compose secrets
        run: |
          set -euo pipefail
          mkdir -p secrets
          printf '%s' 'testpass' > secrets/postgres_password.txt
          printf '%s' 'testpass' > secrets/db_password.txt
          printf '%s' 'testjwt-secret-minimum-32-chars-long-for-testing' > secrets/jwt_secret.txt
          printf '%s' 'testjwt-refresh-secret-minimum-32-chars-long' > secrets/jwt_refresh_secret.txt
          printf '%s' 'testwazuhpass' > secrets/wazuh_api_password.txt
          printf '%s' 'testredispass' > secrets/redis_password.txt
          printf '%s' 'testmisppass' > secrets/misp_password.txt
          touch .env

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate Grafana dashboard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p = "infrastructure/monitoring/grafana/dashboards/soc-overview.json"
          d = json.load(open(p))
          assert d.get("uid") == "soc-overview", "Bad Grafana dashboard uid"
          assert len(d.get("panels", [])) >= 10, "Expected at least 10 Grafana panels"
          print("Grafana dashboard OK")
          PY

      - name: Validate Prometheus
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          p = "infrastructure/monitoring/prometheus/prometheus.yml"
          d = yaml.safe_load(open(p))
          jobs = [x.get("job_name") for x in d.get("scrape_configs", [])]
          assert "minisoc-backend" in jobs, "Missing minisoc-backend scrape job"
          print(jobs)
          PY

      - name: Validate workflow YAML
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, yaml
          for p in glob.glob(".github/workflows/*.yml"):
              yaml.safe_load(open(p))
              print("Valid:", p)
          PY

  # ============================================================
  # 7. DATABASE VALIDATION
  # ============================================================
  database-validation:
    name: PostgreSQL / Prisma Validation
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: minisoc_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d minisoc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci --omit=optional

      - name: Prisma generate / validate / schema
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ env.POSTGRES_TEST_URL }}
        run: |
          set -euo pipefail
          npx prisma generate
          npx prisma validate
          npx prisma db push --skip-generate --accept-data-loss

      - name: Seed
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ env.POSTGRES_TEST_URL }}
        run: npx prisma db seed

      - name: Verify required tables
        run: |
          set -euo pipefail
          PGPASSWORD=test psql -h localhost -U test -d minisoc_test -c "\dt" | tee tables.txt
          grep -q "users" tables.txt
          grep -q "incidents" tables.txt
          grep -q "alerts" tables.txt

  # ============================================================
  # 8. ML VALIDATION
  # ============================================================
  ml-validation:
    name: ML Training / Evaluation / API
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/ml-engine/requirements.txt

      - name: Install ML dependencies
        run: python -m pip install -r services/ml-engine/requirements.txt pyyaml

      - name: Generate training data
        run: python services/ml-engine/training/generate_synthetic_data.py

      - name: Train model
        run: python services/ml-engine/training/train.py

      - name: Evaluate model
        run: python services/ml-engine/training/evaluate.py

      - name: Regression validation
        run: python services/ml-engine/training/validate_model.py

      - name: Start ML API and test anomaly endpoint
        run: |
          set -euo pipefail
          cd services/ml-engine
          uvicorn main:app --host 127.0.0.1 --port 8000 > ../../ml-engine.log 2>&1 &
          echo $! > ../../ml-engine.pid

          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 ; then
              echo "ML Engine ready after ${i}s"
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -eq 0 ]; then
            echo "::error::ML Engine failed to start within 30 seconds"
            cat ../../ml-engine.log
            exit 1
          fi

          curl -fsS http://127.0.0.1:8000/health | tee ../../ml-health.json

          curl -fsS -X POST http://127.0.0.1:8000/detect-anomaly \
            -H 'Content-Type: application/json' \
            -d '{"hour_of_day":3,"day_of_week":6,"alert_level":14,"src_port":31337,"dst_port":4444,"bytes_transferred":5000000,"connection_duration":120,"failed_attempts":50,"unique_destinations":30,"is_internal_src":false}' \
            | tee ../../ml-anomaly.json

          python3 - <<'PY'
          import json
          data = json.load(open("../../ml-anomaly.json"))
          assert isinstance(data.get("anomaly_score"), (int, float)), f"Invalid anomaly_score: {data}"
          print("Anomaly check passed successfully.")
          PY

      - name: Stop ML API
        if: always()
        run: |
          if [ -f ml-engine.pid ]; then
            kill "$(cat ml-engine.pid)" 2>/dev/null || true
          fi

      - name: Upload ML artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-validation
          path: |
            services/ml-engine/models/
            ml-engine.log
            ml-health.json
            ml-anomaly.json
          retention-days: 30
          if-no-files-found: ignore

  # ============================================================
  # 9. MITRE ATT&CK / SIGMA / WAZUH / SURICATA VALIDATION
  # ============================================================
  security-content-validation:
    name: MITRE / Sigma / Wazuh / Suricata
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install pyyaml

      - name: Validate Suricata rules
        run: |
          set -euo pipefail
          f="security/suricata/rules/custom-minisoc.rules"
          test -s "$f"
          count=$(grep -c '^alert ' "$f")
          test "$count" -gt 0
          echo "Suricata rules: $count"

          if grep '^alert ' "$f" | grep -v 'sid:' >/dev/null; then
            echo "Rule without sid detected"
            exit 1
          fi

      - name: Validate Wazuh rules XML
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in ["security/wazuh/rules/local_rules.xml", "security/wazuh/ossec.conf"]:
              ET.parse(path)
          root=ET.parse("security/wazuh/rules/local_rules.xml").getroot()
          rules=root.findall(".//rule")
          assert rules
          for r in rules:
              assert r.get("id")
              assert r.get("level")
          print("Wazuh rules OK:", len(rules))
          PY

      - name: Validate Sigma rules
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, yaml
          paths=glob.glob("security/sigma/rules/*.yml")
          assert paths, "No Sigma rules"
          count=0
          for p in paths:
              for doc in yaml.safe_load_all(open(p)):
                  if isinstance(doc, dict):
                      assert doc.get("title"), p
                      count += 1
          assert count > 0
          print("Sigma rules OK:", count)
          PY

      - name: Generate and validate MITRE ATT&CK Navigator layer
        run: |
          set -euo pipefail
          python security/mitre/generate-layer.py --base-dir .
          python security/mitre/validate-layer.py
          python3 - <<'PY'
          import json
          d=json.load(open("security/mitre/techniques.json"))
          assert d.get("total",0) > 0
          print("MITRE techniques:", d["total"])
          PY

      - name: Upload MITRE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mitre-attack-layer
          path: |
            security/mitre/attack-layer.json
            security/mitre/techniques.json
          retention-days: 90
          if-no-files-found: ignore

  # ============================================================
  # 10. SOAR / OBSERVABILITY STATIC VALIDATION
  # ============================================================
  platform-validation:
    name: SOAR / Grafana / Prometheus Validation
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install pyyaml

      - name: Validate n8n workflows
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json
          files=glob.glob("infrastructure/n8n/workflows/*.json")
          assert files, "No n8n workflows found"
          for p in files:
              d=json.load(open(p))
              assert isinstance(d.get("nodes",[]), list), p
              print(p, "nodes:", len(d.get("nodes",[])))
          PY

      - name: Validate SOAR backend
        run: |
          set -euo pipefail
          test -f apps/backend/src/soar/soar.service.ts
          test -f apps/backend/src/soar/soar.controller.ts
          test -f apps/backend/src/soar/playbook-engine.service.ts

      - name: Validate Grafana dashboard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open("infrastructure/monitoring/grafana/dashboards/soc-overview.json"))
          assert d.get("uid") == "soc-overview"
          panels=d.get("panels",[])
          assert len(panels) >= 10
          titles=[p.get("title","") for p in panels]
          assert any("Alert" in t for t in titles)
          assert any("Incident" in t for t in titles)
          assert any("Health" in t or "API" in t for t in titles)
          PY

      - name: Validate Prometheus
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          p=yaml.safe_load(open("infrastructure/monitoring/prometheus/prometheus.yml"))
          jobs=[x.get("job_name") for x in p.get("scrape_configs",[])]
          assert "minisoc-backend" in jobs
          a=yaml.safe_load(open("infrastructure/monitoring/prometheus/alerts/minisoc.yml"))
          rules=sum(len(g.get("rules",[])) for g in a.get("groups",[]))
          assert rules >= 3
          print("Prometheus jobs:", jobs)
          print("Alert rules:", rules)
          PY

      - name: Validate required metrics
        run: |
          set -euo pipefail
          f="apps/backend/src/metrics/metrics.service.ts"
          for metric in \
            minisoc_soar_executions_total \
            minisoc_soar_failures_total \
            minisoc_ml_predictions_total \
            minisoc_ml_anomalies_total; do
            grep -q "$metric" "$f"
          done

  # ============================================================
  # 11. FULL MINI-SOC E2E STACK
  # ============================================================
  minisoc-e2e:
    name: Full Mini-SOC E2E
    runs-on: ubuntu-latest
    needs:
      - build
      - infra-validation
      - database-validation
      - ml-validation
      - security-content-validation
      - platform-validation
    timeout-minutes: 60

    env:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci-test-db-password-123' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-super-secret-jwt-key-minimum-32-chars' }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci-super-secret-refresh-key-minimum-32-chars' }}
      ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
      SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
      MISP_API_KEY: ${{ secrets.MISP_API_KEY }}
      TAXII_URL: ${{ secrets.TAXII_URL }}
      TAXII_API_ROOT: ${{ secrets.TAXII_API_ROOT }}
      TAXII_COLLECTION_ID: ${{ secrets.TAXII_COLLECTION_ID }}
      TAXII_USERNAME: ${{ secrets.TAXII_USERNAME }}
      TAXII_PASSWORD: ${{ secrets.TAXII_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure Docker DNS for GitHub Actions
        run: |
          set -Eeuo pipefail
          echo "=== Configure reliable DNS for Docker containers ==="
          sudo python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("/etc/docker/daemon.json")
          data = json.loads(path.read_text()) if path.exists() else {}
          data["dns"] = ["1.1.1.1", "8.8.8.8"]
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

          sudo systemctl restart docker

      - name: Prepare Linux host for OpenSearch / IDS / Falco
        run: |
          set -euo pipefail
          sudo sysctl -w vm.max_map_count=262144
          sudo sysctl -w vm.overcommit_memory=1 || true
          sudo sysctl -w kernel.unprivileged_bpf_disabled=0 || true
          sudo ip link set eth0 promisc on || true

      - name: Create Mini-SOC CI environment
        run: |
          set -euo pipefail

          PG_PASS="${POSTGRES_PASSWORD:-ci-test-db-password-123}"
          JWT_SEC="${JWT_SECRET:-ci-super-secret-jwt-key-minimum-32-chars}"
          JWT_REF_SEC="${JWT_REFRESH_SECRET:-ci-super-secret-refresh-key-minimum-32-chars}"

          mkdir -p secrets

          printf '%s' "$PG_PASS" > secrets/postgres_password.txt
          printf '%s' "$PG_PASS" > secrets/db_password.txt
          printf '%s' "$JWT_SEC" > secrets/jwt_secret.txt
          printf '%s' "$JWT_REF_SEC" > secrets/jwt_refresh_secret.txt
          printf '%s' 'ci-wazuh-password' > secrets/wazuh_api_password.txt
          printf '%s' 'ci-redis-password' > secrets/redis_password.txt
          printf '%s' 'ci-misp-password' > secrets/misp_password.txt

          cat << EOF > .env
          POSTGRES_USER=minisoc_app
          POSTGRES_PASSWORD=${PG_PASS}
          POSTGRES_DB=minisoc
          DATABASE_URL=postgresql://minisoc_app:${PG_PASS}@postgres:5432/minisoc?schema=public

          DB_POSTGRESDB_USER=minisoc_app
          DB_POSTGRESDB_PASSWORD=${PG_PASS}
          DB_POSTGRESDB_DATABASE=n8n

          JWT_SECRET=${JWT_SEC}
          JWT_REFRESH_SECRET=${JWT_REF_SEC}
          API_CORS_ORIGINS=*
          API_PORT=4000

          ORACLE_PORTS=1521
          HTTP_PORTS=80

          IFACE=eth0
          SURICATA_OPTIONS="-i eth0"
          SURICATA_INTERFACE=eth0
          ZEEK_INTERFACE=eth0

          ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
          VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
          OTX_API_KEY=${OTX_API_KEY:-}
          ALIENVAULT_OTX_API_KEY=${OTX_API_KEY:-}
          SHODAN_API_KEY=${SHODAN_API_KEY:-}
          MISP_URL=http://misp:80
          MISP_API_KEY=${MISP_API_KEY:-}
          TAXII_URL=${TAXII_URL:-}
          TAXII_API_ROOT=${TAXII_API_ROOT:-}
          TAXII_COLLECTION_ID=${TAXII_COLLECTION_ID:-}
          TAXII_USERNAME=${TAXII_USERNAME:-}
          TAXII_PASSWORD=${TAXII_PASSWORD:-}

          MINISOC_CI_TEST_ID=${MINISOC_CI_TEST_ID}
          NODE_ENV=test
          OPENSEARCH_INITIAL_ADMIN_PASSWORD=Admin123456789!
          EOF

          if [ -f ./scripts/generate-certs.sh ]; then
            chmod +x ./scripts/generate-certs.sh
            ./scripts/generate-certs.sh
          fi

          mkdir -p infrastructure/vault/tls
          if [ -f infrastructure/nginx/ssl/fullchain.pem ]; then
            cp infrastructure/nginx/ssl/fullchain.pem infrastructure/vault/tls/vault-cert.pem
            cp infrastructure/nginx/ssl/privkey.pem infrastructure/vault/tls/vault-key.pem
            chmod 644 infrastructure/vault/tls/vault-cert.pem
            chmod 600 infrastructure/vault/tls/vault-key.pem
          fi

      - name: Start PostgreSQL Redis OpenSearch Vault
        run: |
          set -euo pipefail
          docker compose --env-file .env up -d postgres redis opensearch vault

          echo "Waiting for core infrastructure..."
          for i in $(seq 1 60); do
            PG_OK=0; REDIS_OK=0; OS_OK=0
            docker inspect --format='{{.State.Health.Status}}' minisoc-postgres 2>/dev/null | grep -q healthy && PG_OK=1 || true
            docker inspect --format='{{.State.Health.Status}}' minisoc-redis 2>/dev/null | grep -q healthy && REDIS_OK=1 || true
            docker inspect --format='{{.State.Health.Status}}' minisoc-opensearch 2>/dev/null | grep -q healthy && OS_OK=1 || true

            if [ "$PG_OK" -eq 1 ] && [ "$REDIS_OK" -eq 1 ] && [ "$OS_OK" -eq 1 ]; then
              echo "Core infrastructure ready"
              break
            fi
            sleep 5
          done

      - name: Vault Initialization & Auto-unseal
        run: |
          set -euo pipefail
          VAULT_EXEC="docker exec -e VAULT_ADDR=https://127.0.0.1:8200 -e VAULT_SKIP_VERIFY=true minisoc-vault vault"

          VAULT_READY=0
          for i in $(seq 1 40); do
            $VAULT_EXEC status > /dev/null 2>&1 || STATUS_EXIT=$?
            if [ "${STATUS_EXIT:-1}" -eq 0 ] || [ "${STATUS_EXIT:-1}" -eq 2 ]; then
              VAULT_READY=1
              break
            fi
            sleep 2
          done

          if [ "$VAULT_READY" -eq 1 ]; then
            STATUS_JSON=$($VAULT_EXEC status -format=json || true)
            IS_INIT=$(echo "$STATUS_JSON" | jq -r '.initialized // false')
            IS_SEALED=$(echo "$STATUS_JSON" | jq -r '.sealed // true')

            if [ "$IS_INIT" = "false" ]; then
              INIT_JSON=$($VAULT_EXEC operator init -key-shares=3 -key-threshold=2 -format=json)
              KEY1=$(echo "$INIT_JSON" | jq -r '.unseal_keys_b64[0]')
              KEY2=$(echo "$INIT_JSON" | jq -r '.unseal_keys_b64[1]')
              $VAULT_EXEC operator unseal "$KEY1" > /dev/null
              $VAULT_EXEC operator unseal "$KEY2" > /dev/null
            fi
          fi

      - name: Pre-build and Start Mini-SOC stack
        run: |
          set -euo pipefail
          docker compose --env-file .env build
          docker compose --env-file .env up -d

      - name: Validate API and Services
        run: |
          set -euo pipefail
          echo "Waiting for API endpoint..."
          for i in $(seq 1 30); do
            if curl -kfsS https://localhost/api/health >/dev/null 2>&1 || docker exec minisoc-api node -e "require('http').get('http://localhost:4000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })" >/dev/null 2>&1; then
              echo "API is healthy!"
              break
            fi
            sleep 2
          done

      - name: Validate Threat Intel lookup
        env:
          BASE_URL: https://localhost/api
        run: |
          set -euo pipefail

          LOGIN_CODE=$(curl -ks -o /tmp/threat-intel-login.json -w '%{http_code}' \
            -X POST "$BASE_URL/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@minisoc.local","password":"Admin@MiniSOC2026!"}')
          test "$LOGIN_CODE" -ge 200
          test "$LOGIN_CODE" -lt 300

          TOKEN=$(jq -r '.accessToken // .access_token // .token // empty' /tmp/threat-intel-login.json)
          test -n "$TOKEN"

          TEST_IOC="198.51.100.42"
          CREATE_CODE=$(curl -ks -o /tmp/threat-intel-ioc.json -w '%{http_code}' \
            -X POST "$BASE_URL/iocs" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"type\":\"ip\",\"value\":\"$TEST_IOC\",\"confidence\":95,\"severity\":\"high\",\"source\":\"ci-threat-intel\",\"tags\":[\"ci\",\"threat-intel\"]}")

          if [ "$CREATE_CODE" -ge 200 ] && [ "$CREATE_CODE" -lt 300 ]; then
            echo "Created CI IOC $TEST_IOC"
          elif [ "$CREATE_CODE" -eq 409 ]; then
            echo "CI IOC $TEST_IOC already exists"
          else
            cat /tmp/threat-intel-ioc.json
            echo "Threat Intel test IOC creation failed with HTTP $CREATE_CODE"
            exit 1
          fi

          LOOKUP_CODE=$(curl -ks -o /tmp/threat-intel-lookup.json -w '%{http_code}' \
            "$BASE_URL/threat-intel/lookup/$TEST_IOC" \
            -H "Authorization: Bearer $TOKEN")

          cat /tmp/threat-intel-lookup.json
          test "$LOOKUP_CODE" -ge 200
          test "$LOOKUP_CODE" -lt 300
          jq -e --arg ioc "$TEST_IOC" \
            '.ioc == $ioc and .malicious == true and (.confidence >= 90) and .localIocMatch != null' \
            /tmp/threat-intel-lookup.json >/dev/null
          echo "Threat Intel lookup returned a confirmed local match."

      - name: Collect Docker status
        if: always()
        run: docker compose ps

      - name: Cleanup Mini-SOC stack
        if: always()
        run: docker compose --env-file .env down -v --remove-orphans

  # ============================================================
  # 12. DOCKER BUILD / PUSH
  # ============================================================
  docker-push:
    name: Docker Build / Push (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs:
      - security
      - minisoc-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            image_name: backend
          - app: frontend
            image_name: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image_name }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 13. SUMMARY
  # ============================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - lint
      - test-backend
      - test-frontend
      - build
      - security
      - infra-validation
      - database-validation
      - ml-validation
      - security-content-validation
      - platform-validation
      - minisoc-e2e
      - docker-push
    if: always()

    steps:
      - name: Publish summary
        run: |
          {
            echo "## Mini-SOC CI Summary"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Backend tests | ${{ needs.test-backend.result }} |"
            echo "| Frontend tests | ${{ needs.test-frontend.result }} |"
            echo "| Build | ${{ needs.build.result }} |"
            echo "| Security scan | ${{ needs.security.result }} |"
            echo "| Infrastructure | ${{ needs.infra-validation.result }} |"
            echo "| Database / Prisma | ${{ needs.database-validation.result }} |"
            echo "| ML training / validation | ${{ needs.ml-validation.result }} |"
            echo "| MITRE / Sigma / Wazuh / Suricata | ${{ needs.security-content-validation.result }} |"
            echo "| SOAR / Grafana / Prometheus | ${{ needs.platform-validation.result }} |"
            echo "| Full Mini-SOC E2E | ${{ needs.minisoc-e2e.result }} |"
            echo "| Docker push | ${{ needs.docker-push.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"