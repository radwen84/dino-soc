name: MiniSOC Continuous Integration & E2E Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------
      # 1. RÉCUPÉRATION DU CODE
      # ------------------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. PRÉPARATION DU SYSTÈME ET DU RÉSEAU DOCKER
      # ------------------------------------------------------------------
      - name: Setup System Environment
        run: |
          echo "Configuration de vm.max_map_count pour OpenSearch..."
          sudo sysctl -w vm.max_map_count=262144
          
          echo "Création du réseau Docker minisoc-network..."
          docker network create minisoc-network || true

      # ------------------------------------------------------------------
      # 3. CRÉATION DU DOSSIER SECRETS ET INJECTION DU .ENV
      # ------------------------------------------------------------------
      - name: Generate Secrets and .env File
        run: |
          echo "Création du dossier secrets/..."
          mkdir -p secrets

          # Génération des paires de clés JWT et TLS si absentes
          if [ ! -f secrets/jwt_private.pem ]; then
            openssl genrsa -out secrets/jwt_private.pem 2048
            openssl rsa -in secrets/jwt_private.pem -outform PEM -pubout -out secrets/jwt_public.pem
          fi

          if [ ! -f secrets/cert.pem ]; then
            openssl req -x509 -newkey rsa:2048 -nodes -keyout secrets/key.pem -out secrets/cert.pem -days 365 -subj "/CN=localhost"
          fi

          # Création du fichier .env consolidé pour Docker Compose
          cat <<EOF > .env
          DATABASE_URL=postgresql://minisoc_user:minisoc_pass@postgres:5432/minisoc_db?schema=public
          POSTGRES_USER=minisoc_user
          POSTGRES_PASSWORD=minisoc_pass
          POSTGRES_DB=minisoc_db
          JWT_SECRET=super_secret_jwt_key_minisoc_2026_e2e
          OPENSEARCH_NODE=http://opensearch:9200
          VAULT_ADDR=http://vault:8200
          VAULT_TOKEN=root
          REDIS_HOST=redis
          REDIS_PORT=6379
          NODE_ENV=test
          EOF

          echo "Fichier .env généré avec succès."

      # ------------------------------------------------------------------
      # 4. TESTS UNITAIRES ET PRISMA GENERATE
      # ------------------------------------------------------------------
      - name: Setup Node.js & Run Unit Tests
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Run Tests
        run: |
          npm ci || npm install
          npx prisma generate
          npm run test --if-present

      # ------------------------------------------------------------------
      # 5. DÉPLOIEMENT DE LA STACK DOCKER COMPOSE
      # ------------------------------------------------------------------
      - name: Start MiniSOC Infrastructure via Docker Compose
        run: |
          docker compose up -d --build
          echo "Attente du démarrage initial des conteneurs (20s)..."
          sleep 20

      # ------------------------------------------------------------------
      # 5b. UNSEAL DE HASHICORP VAULT (SI NÉCESSAIRE)
      # ------------------------------------------------------------------
      - name: Unseal HashiCorp Vault
        run: |
          echo "Vérification et Unseal de Vault..."
          VAULT_STATUS=$(docker exec minisoc-vault vault status -format=json 2>/dev/null || true)
          
          if echo "$VAULT_STATUS" | grep -q '"sealed":true'; then
            echo "Vault est verrouillé. Initialisation / Unseal en cours..."
            INIT_KEYS=$(docker exec minisoc-vault vault operator init -key-shares=1 -key-threshold=1 -format=json)
            UNSEAL_KEY=$(echo "$INIT_KEYS" | jq -r '.unseal_keys_b64[0]')
            ROOT_TOKEN=$(echo "$INIT_KEYS" | jq -r '.root_token')

            docker exec minisoc-vault vault operator unseal "$UNSEAL_KEY"
            echo "Vault déverrouillé avec succès."
          else
            echo "Vault est déjà opérationnel ou non scellé."
          fi

      # ------------------------------------------------------------------
      # 6. ATTENTE ET SANTÉ DES SERVICES (HEALTH CHECKS)
      # ------------------------------------------------------------------
      - name: Wait for Services to be Ready
        run: |
          echo "1. Vérification Postgres..."
          until docker exec minisoc-postgres pg_isready -U minisoc_user -d minisoc_db; do
            echo "Attente de PostgreSQL..."
            sleep 3
          done

          echo "2. Vérification OpenSearch..."
          until curl -s http://localhost:9200/_cluster/health | grep -E '"status":"(green|yellow)"'; do
            echo "Attente d'OpenSearch..."
            sleep 5
          done

          echo "3. Vérification MiniSOC Backend API..."
          until curl -sLk https://localhost/api/health | grep -q '"status"'; do
            echo "Attente du Backend NestJS..."
            sleep 5
          done

          echo "Tous les services sont opérationnels !"

      # ------------------------------------------------------------------
      # 7. INJECTION DE DONNÉES D'ATTAQUES DANS OPENSEARCH
      # ------------------------------------------------------------------
      - name: Inject Sample Security Events in OpenSearch
        run: |
          echo "Injection d'une alerte de test dans OpenSearch..."
          curl -s -X POST "http://localhost:9200/alerts/_doc/1" \
            -H "Content-Type: application/json" \
            -d '{
              "@timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
              "rule": {"name": "ET WEB_SERVER SQL Injection Attempt"},
              "src_ip": "192.168.1.100",
              "dest_ip": "10.0.0.5",
              "severity": 3,
              "agent": {"id": "suricata-sensor-01"}
            }'
          
          echo "Rafraîchissement de l'index..."
          curl -s -X POST "http://localhost:9200/alerts/_refresh"

      # ------------------------------------------------------------------
      # 8. SIMULATION D'ATTAQUE NETWORK (SURICATA NIDS)
      # ------------------------------------------------------------------
      - name: Trigger Suricata NIDS Alert (Simulated Attack)
        run: |
          echo "Envoi de requêtes malveillantes via Nginx pour faire réagir Suricata..."
          curl -sLk "https://localhost/?id=1%27%20OR%201=1--%20UNION%20SELECT%20username,password%20FROM%20users" || true
          curl -sLk "https://localhost/../../../../etc/passwd" || true

      # ------------------------------------------------------------------
      # 9. SIMULATION D'ATTAQUE RUNTIME (FALCO HIDS)
      # ------------------------------------------------------------------
      - name: Trigger Falco Runtime Alert
        run: |
          echo "Exécution d'une commande suspecte dans l'API MiniSOC pour faire déclencher Falco..."
          docker exec minisoc-api cat /etc/shadow || true

      # ------------------------------------------------------------------
      # 10. MIGRATION DATABASE & SEED PRISMA
      # ------------------------------------------------------------------
      - name: Run Database Migrations & Seeds
        run: |
          echo "Exécution des migrations Prisma..."
          docker exec minisoc-api npx prisma migrate deploy || docker exec minisoc-api npx prisma db push --accept-data-loss
          echo "Exécution du Seed Prisma..."
          docker exec minisoc-api npx prisma db seed || true

      # ------------------------------------------------------------------
      # 11. SUITE DE TESTS COMPLÈTE API REST (16 ENDPOINTS)
      # ------------------------------------------------------------------
      - name: Run Full REST API End-to-End Tests
        run: |
          echo "=== DÉBUT DES TESTS DE L'API REST ==="

          # 1. POST /api/auth/register (Utilisateur de test)
          echo -e "\n---> [1/16] POST /api/auth/register"
          curl -sLk -X POST "https://localhost/api/auth/register" \
            -H "Content-Type: application/json" \
            -d '{
              "email": "analyst@minisoc.local",
              "password": "SecurePassword2026!",
              "name": "SOC Analyst Test"
            }' || true

          # 2. POST /api/auth/login (Obtention du JWT)
          echo -e "\n---> [2/16] POST /api/auth/login"
          LOGIN_RES=$(curl -sLk -X POST "https://localhost/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{
              "email": "analyst@minisoc.local",
              "password": "SecurePassword2026!"
            }')
          echo "Réponse Login: $LOGIN_RES"

          TOKEN=$(echo "$LOGIN_RES" | jq -r '.accessToken // .token // .access_token')

          if [ "$TOKEN" == "null" ] || [ -z "$TOKEN" ]; then
            echo "ÉCHEC: Impossible de récupérer le token JWT pour la suite des tests."
            echo "Vérifiez les logs de minisoc-api:"
            docker logs minisoc-api --tail 50
            exit 1
          fi

          echo "Token JWT extrait avec succès."

          # 3. GET /api/auth/me
          echo -e "\n---> [3/16] GET /api/auth/me"
          curl -sLk -X GET "https://localhost/api/auth/me" \
            -H "Authorization: Bearer $TOKEN"

          # 4. GET /api/incidents
          echo -e "\n---> [4/16] GET /api/incidents"
          curl -sLk -X GET "https://localhost/api/incidents" \
            -H "Authorization: Bearer $TOKEN"

          # 5. POST /api/incidents
          echo -e "\n---> [5/16] POST /api/incidents"
          CREATE_INCIDENT_RES=$(curl -sLk -X POST "https://localhost/api/incidents" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "title": "Alerte SQL Injection Détectée",
              "description": "Une tentative SQLi a été observée sur le Nginx NIDS",
              "severity": "HIGH",
              "status": "OPEN"
            }')
          echo "Réponse Création Incident: $CREATE_INCIDENT_RES"

          INCIDENT_ID=$(echo "$CREATE_INCIDENT_RES" | jq -r '.id // "1"')

          # 6. GET /api/incidents/:id
          echo -e "\n---> [6/16] GET /api/incidents/$INCIDENT_ID"
          curl -sLk -X GET "https://localhost/api/incidents/$INCIDENT_ID" \
            -H "Authorization: Bearer $TOKEN"

          # 7. PATCH /api/incidents/:id
          echo -e "\n---> [7/16] PATCH /api/incidents/$INCIDENT_ID"
          curl -sLk -X PATCH "https://localhost/api/incidents/$INCIDENT_ID" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "status": "IN_PROGRESS",
              "assignedTo": "analyst@minisoc.local"
            }'

          # 8. POST /api/threat-intel/iocs
          echo -e "\n---> [8/16] POST /api/threat-intel/iocs"
          curl -sLk -X POST "https://localhost/api/threat-intel/iocs" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "type": "IP",
              "value": "192.168.1.100",
              "threatType": "Malicious_Host",
              "confidence": 90
            }'

          # 9. GET /api/threat-intel/iocs
          echo -e "\n---> [9/16] GET /api/threat-intel/iocs"
          curl -sLk -X GET "https://localhost/api/threat-intel/iocs" \
            -H "Authorization: Bearer $TOKEN"

          # 10. GET /api/threat-intel/search?ip=192.168.1.100
          echo -e "\n---> [10/16] GET /api/threat-intel/search"
          curl -sLk -X GET "https://localhost/api/threat-intel/search?value=192.168.1.100" \
            -H "Authorization: Bearer $TOKEN"

          # 11. POST /api/threat-intel/taxii/ingest
          echo -e "\n---> [11/16] POST /api/threat-intel/taxii/ingest"
          TAXII_RES=$(curl -sLk -X POST "https://localhost/api/threat-intel/taxii/ingest" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "serverUrl": "https://cti-taxii.mitre.org",
              "apiRoot": "taxii2",
              "collectionId": "10f1f12f-70d3-454e-b190-d2d05779080b"
            }' || true)
          echo "Réponse TAXII: $TAXII_RES"

          # 12. GET /api/playbooks
          echo -e "\n---> [12/16] GET /api/playbooks"
          curl -sLk -X GET "https://localhost/api/playbooks" \
            -H "Authorization: Bearer $TOKEN"

          # 13. POST /api/playbooks/execute
          echo -e "\n---> [13/16] POST /api/playbooks/execute"
          curl -sLk -X POST "https://localhost/api/playbooks/execute" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "playbookName": "Isolate-Host",
              "targetIp": "192.168.1.100",
              "incidentId": "'"$INCIDENT_ID"'"
            }' || true

          # 14. GET /api/metrics/overview
          echo -e "\n---> [14/16] GET /api/metrics/overview"
          curl -sLk -X GET "https://localhost/api/metrics/overview" \
            -H "Authorization: Bearer $TOKEN"

          # 15. GET /metrics (Prometheus)
          echo -e "\n---> [15/16] GET /metrics (Prometheus)"
          curl -sLk -X GET "https://localhost/metrics"

          # 16. GET /api/health
          echo -e "\n---> [16/16] GET /api/health"
          curl -sLk -X GET "https://localhost/api/health"

          echo -e "\n=== TOUS LES TESTS REST API SE SONT EXÉCUTÉS AVEC SUCCÈS ==="

      # ------------------------------------------------------------------
      # 12. AUDIT DE SÉCURITÉ DES CONTENEURS (TRIVY SAST)
      # ------------------------------------------------------------------
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'minisoc-api:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # ------------------------------------------------------------------
      # 13. CAPTURE DES LOGS EN CAS D'ÉCHEC
      # ------------------------------------------------------------------
      - name: Dump Docker Logs on Failure
        if: failure()
        run: |
          echo "=== DUMP DES LOGS DES CONTENEURS ==="
          docker compose logs --tail=100